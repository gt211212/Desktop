<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Oficina</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
<div class="card">
<h1>Sistema de Gestão</h1>
<p class="subtitle">Oficina Mecânica</p>
<form id="formLogin">
<div class="form-group"><label>E-mail</label><input class="field" type="email" placeholder="seu@email.com" required></div>
<br>
<div class="form-group"><label>Senha</label><input class="field" type="password" placeholder="Sua senha" required></div>
<br>
<button class="btn" style="width:100%">Entrar</button>
</form>
</div>
</div>
<script src="js/app.js"></script>
<script>
document.getElementById("formLogin").addEventListener("submit", function (e) {
  e.preventDefault();
  localStorage.setItem("logado", "1");
  location.href = "dashboard.html";
});
</script>
</body>
</html>
