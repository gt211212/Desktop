<main class="main">
<header class="topbar">
<input class="search" id="buscaGlobal" placeholder="Buscar nesta página...">
<div class="user"><span data-user>Bruno Honorato</span><br><small>Administrador</small></div>
</header>
<section class="content">
<h1>Clientes</h1>
<p class="subtitle">Cadastre e gerencie seus clientes.</p>

<div class="toolbar">
<input class="field" id="busca" placeholder="Buscar nome, telefone ou CPF/CNPJ...">

<button class="btn" data-novo>+ Novo Cliente</button>
</div>
<div class="card table-wrap">
<table>
<thead><tr><th>ID</th><th>Nome</th><th>Telefone</th><th>CPF/CNPJ</th><th>E-mail</th><th>Ações</th></tr></thead>
<tbody id="tabela"></tbody>
</table>
</div>

<div id="modalCadastro" class="modal">
<div class="modal-box">
<div class="modal-head"><h2>Novo Cliente</h2><button type="button" class="btn danger small" onclick="closeModal('modalCadastro')">✕</button></div>
<form id="formCadastro">
<input type="hidden" name="_id">
<div class="form-grid">
<div class="form-group full"><label>Nome</label><input class="field" type="text" name="nome" id="f_nome" required ></div><div class="form-group"><label>Telefone</label><input class="field" type="text" name="telefone" id="f_telefone" required ></div><div class="form-group"><label>CPF/CNPJ</label><input class="field" type="text" name="documento" id="f_documento" ></div><div class="form-group full"><label>E-mail</label><input class="field" type="email" name="email" id="f_email" ></div>
</div>
<div class="form-footer"><button type="button" class="btn secondary" onclick="closeModal('modalCadastro')">Cancelar</button><button type="submit" class="btn">Salvar cliente</button></div>
</form>
</div>
</div>
</section>
</main>
<script src="js/app.js"></script>
<script src="js/clientes.js"></script>
</body>
</html>
